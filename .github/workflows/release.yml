name: Release

# main へのプッシュごとに自動リリース
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── バージョン計算 ─────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag:     ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: バージョン計算 (major.minor from tauri.conf.json + run_number as patch)
        id: calc
        run: |
          BASE=$(jq -r '.version' src-tauri/tauri.conf.json | sed 's/\.[^.]*$//')
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT

  # ── クロスプラットフォームビルド & リリース ─────────────────────────────────
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
            rust_targets: ''
          - os: windows-latest
            args: ''
            rust_targets: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: tauri.conf.json のバージョンを自動計算値に差し替え
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Linux 依存パッケージのインストール
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: npm 依存パッケージのインストール
        run: npm install

      - name: Rust のインストール
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust ビルドキャッシュ
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: アプリアイコンの生成
        run: python3 scripts/gen_icon.py

      - name: ビルド & リリースへアップロード
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName:     ${{ needs.version.outputs.tag }}
          releaseName: 'vViewer ${{ needs.version.outputs.tag }}'
          releaseBody: |
            ## vViewer ${{ needs.version.outputs.tag }}

            大量の動画ファイルを高速に閲覧できる動画ビューアです。

            **コミット:** ${{ github.sha }}

            ### ダウンロード

            | OS | ファイル |
            |---|---|
            | Windows | `.msi` または `setup.exe` |
            | macOS | `.dmg`（Intel + Apple Silicon ユニバーサル） |
            | Linux | `.AppImage` または `.deb` |

            ### ワンコマンドインストール

            **Linux / macOS**
            ```sh
            curl -sSfL https://raw.githubusercontent.com/dikmri/vViewer/main/install.sh | sh
            ```

            **Windows（PowerShell）**
            ```powershell
            irm https://raw.githubusercontent.com/dikmri/vViewer/main/install.ps1 | iex
            ```

            > **macOS 注意:** コード署名なしのため、初回起動は右クリック→「開く」を選んでください。

            ---

            *High-performance video viewer. [English README](https://github.com/dikmri/vViewer#english)*
          releaseDraft: false
          prerelease:   false
          iconPath:     app-icon.png
          args:         ${{ matrix.args }}
