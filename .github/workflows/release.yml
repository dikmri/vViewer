name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースするタグ（例: v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux 依存パッケージのインストール
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: npm 依存パッケージのインストール
        run: npm install

      - name: Rust のインストール
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust ビルドキャッシュ
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: アプリアイコンの生成
        run: python3 scripts/gen_icon.py

      - name: ビルド & リリースへアップロード
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName:     ${{ github.ref_name }}
          releaseName: 'vViewer ${{ github.ref_name }}'
          releaseBody: |
            ## vViewer ${{ github.ref_name }}

            大量の動画ファイルを高速に閲覧できる動画ビューアです。

            ### ダウンロード

            | OS | ファイル |
            |---|---|
            | Windows | `.msi` インストーラー |
            | macOS | `.dmg`（Intel + Apple Silicon ユニバーサル） |
            | Linux | `.AppImage` または `.deb` |

            ### ワンコマンドインストール

            **Linux / macOS**
            ```sh
            curl -sSfL https://raw.githubusercontent.com/dikmri/vViewer/main/install.sh | sh
            ```

            **Windows（PowerShell）**
            ```powershell
            irm https://raw.githubusercontent.com/dikmri/vViewer/main/install.ps1 | iex
            ```

            > **macOS 注意:** コード署名なしのため、初回起動は右クリック→「開く」を選んでください。

            ---

            *High-performance video viewer. [English README](https://github.com/dikmri/vViewer#english)*
          releaseDraft: false
          prerelease:   false
          iconPath:     app-icon.png
          args:         ${{ matrix.args }}
